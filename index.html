<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS 环球购 · 模拟商城</title>
<style>
:root{--ink:#14181F;--ink2:#3A4350;--teal:#0E7C7B;--teal-d:#0A5E5D;--gold:#B58A3C;--gold-l:#EBDDB9;--soft:#F6F7F9;--line:#E8EAEE;--muted:#8A93A0;--red:#D8344F;--green:#1E9E6A;--r:16px;--serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:auto;display:flex;align-items:center;gap:24px;padding:14px 24px}
.logo{font:600 22px var(--serif);letter-spacing:.16em;white-space:nowrap}
.logo b{color:var(--gold);font-weight:400;margin:0 .1em}
.search{flex:1;max-width:520px;margin:0 auto;display:flex;background:var(--soft);border-radius:999px;border:1px solid transparent;overflow:hidden;transition:.2s}
.search:focus-within{background:#fff;border-color:var(--ink)}
.search input{flex:1;border:0;background:none;padding:10px 20px;outline:none;min-width:0;font-size:14px}
.search button{padding:0 20px;color:var(--ink2);font-size:14px}
.nav-ic{position:relative;padding:6px 2px;white-space:nowrap;font-size:14px;color:var(--ink2);border-bottom:1px solid transparent}
.nav-ic:hover{color:var(--ink);border-color:var(--ink)}
.bal{border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:13px;white-space:nowrap;color:var(--ink);transition:.2s}
.bal:hover{border-color:var(--gold)}
.badge{position:absolute;top:-4px;right:-12px;background:var(--ink);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;font-style:normal}
.badge:empty{display:none}
#app{max-width:1240px;margin:auto;padding:28px 24px 56px;width:100%;flex:1}
#foot{border-top:1px solid var(--line);text-align:center;padding:26px 16px;color:var(--muted);font-size:13px;letter-spacing:.06em}
#foot b{color:var(--ink);font-weight:600;letter-spacing:.1em}
.hero{background:var(--ink);color:#fff;border-radius:28px;padding:56px 56px;display:flex;justify-content:space-between;align-items:center;gap:24px;overflow:hidden;background-image:repeating-radial-gradient(circle at 96% 130%,transparent 0 46px,rgba(235,221,185,.13) 46px 47px)}
.hero h1{font:600 clamp(30px,4.6vw,48px)/1.25 var(--serif);letter-spacing:.04em}
.hero p{color:#AEB9C6;margin:16px 0 26px;max-width:430px;padding-top:16px;border-top:1px solid rgba(235,221,185,.4)}
.tiles{display:flex;gap:14px;padding-right:18px}
.tiles span{width:74px;height:74px;border-radius:50%;border:1px solid rgba(235,221,185,.5);display:grid;place-items:center;font-size:30px}
.tiles span:nth-child(even){transform:translateY(22px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 24px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid transparent;transition:.2s}
.btn.pri{background:var(--ink);color:#fff}.btn.pri:hover{background:#000}
.btn.gold{background:var(--gold-l);color:var(--ink)}.btn.gold:hover{background:#fff}
.btn.ghost{border-color:var(--line);background:#fff}.btn.ghost:hover{border-color:var(--ink)}
.btn.dark{background:#fff;color:var(--ink);border-color:var(--ink)}.btn.dark:hover{background:var(--ink);color:#fff}
.btn.sm{padding:6px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;gap:30px;overflow-x:auto;margin-top:30px;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:12px 0;color:var(--muted);font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.2s}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:40px 0 18px}
.sec-h h2{font:600 22px var(--serif);letter-spacing:.04em}
.sec-h span,.muted{color:var(--muted);font-size:13px}
select.sel{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 22px}
.row-scroll{display:flex;gap:22px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.row-scroll .card{flex:0 0 220px}
.card{display:flex;flex-direction:column;gap:12px}
.card .art{transition:transform .35s}
.card:hover .art{transform:translateY(-4px)}
.art{aspect-ratio:1;display:grid;place-items:center;position:relative;border-radius:var(--r);overflow:hidden}
.art .em{font-size:clamp(54px,9vw,86px);filter:drop-shadow(0 10px 16px rgba(0,0,0,.28))}
.art .mono{font-size:clamp(50px,8vw,78px)}
.art i{position:absolute;left:14px;bottom:11px;font-style:normal;font-size:12px;color:rgba(255,255,255,.85);letter-spacing:.04em}
.art u{position:absolute;left:12px;top:12px;text-decoration:none;font-size:11px;background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:1px 10px}
.cb{display:flex;flex-direction:column;gap:3px;padding:0 2px}
.cn{font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px;font-weight:500}
.cm{font-size:12px;color:var(--muted)}
.cp b{font-size:16px;font-weight:600}
.cp small{color:var(--muted);margin-left:4px;font-size:12px}
.cp s{color:var(--muted);font-size:12px;margin-left:8px}
.stars{background:linear-gradient(90deg,var(--gold) var(--p),#DADDE3 var(--p));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.up{color:var(--green)}.dn{color:var(--red)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:22px}
.crumb a:hover{color:var(--ink)}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.pd .art{border-radius:28px;position:sticky;top:96px}
.pd .art .em{font-size:clamp(110px,18vw,200px)}.pd .art .mono{font-size:clamp(100px,16vw,170px)}
.pd h1{font:600 28px/1.35 var(--serif);margin:6px 0 10px;letter-spacing:.02em}
.brand{color:var(--gold);font-weight:600;font-size:14px;letter-spacing:.05em}
.rate-line{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pricebox{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin:20px 0}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price b{font:600 38px var(--serif);letter-spacing:-.01em}
.price s{color:var(--muted)}
.price em{font-style:normal;border:1px solid var(--red);color:var(--red);font-size:12px;padding:0 10px;border-radius:999px}
.tip{font-size:13px;color:var(--muted);margin-top:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:18px}
.seg button{flex:1;padding:8px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:.2s}
.seg button.on{background:var(--ink);color:#fff}
.spark{height:84px;margin:10px 0 4px}
.spark svg{width:100%;height:100%;display:block}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 22px;margin-top:16px}
.facts div{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.facts small{display:block;color:var(--muted);font-size:12px}
.opt-g{margin:20px 0}
.opt-g>small{display:block;color:var(--muted);margin-bottom:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 18px;font-size:14px;transition:.2s}
.opts button:hover{border-color:var(--ink)}
.opts button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}
.qty button{width:40px;height:40px;font-size:18px;color:var(--ink2)}
.qty button:hover{background:var(--soft)}
.qty input{width:84px;text-align:center;border:0;outline:none;height:40px;font-weight:600}
.qchips{display:flex;gap:6px;margin-top:10px}
.qchips button{font-size:12px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:#fff}
.qchips button:hover{border-color:var(--ink)}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:22px 0;font-size:13px;color:var(--ink2)}
.svc span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:9px;vertical-align:middle}
.cta{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.cta .btn{flex:1;min-width:130px;padding:15px 20px;font-size:15px}
.heart{width:52px;flex:0 0 52px!important;min-width:0!important;padding:0!important;font-size:20px}
.heart.on{color:var(--red);border-color:var(--red)}
.sec{border-top:1px solid var(--line);padding:38px 0;margin-top:34px}
.sec h2{font:600 21px var(--serif);margin-bottom:16px;letter-spacing:.04em}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:18px}
.panel h2{font:600 19px var(--serif);margin-bottom:12px;letter-spacing:.03em}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.specs div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.specs span{color:var(--muted)}
.rv-sum{display:flex;gap:40px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.rv-big{font:600 54px/1 var(--serif)}
.dist{flex:1;min-width:220px;display:grid;gap:6px}
.dist div{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.dist i{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.dist i b{display:block;height:100%;background:var(--ink)}
.rv{padding:20px 0;border-top:1px solid var(--line)}
.rv-h{display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none}
.tag{font-size:11px;color:var(--teal-d);border:1px solid #BFDEDC;border-radius:999px;padding:0 9px}
.rv p{margin:10px 0 8px;font-size:14.5px;color:var(--ink2);max-width:780px}
.rv-f{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.rv-f button{padding:2px 12px;border:1px solid var(--line);border-radius:999px;font-size:12px}
.rv-f button.on{color:var(--ink);border-color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
.line{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.line:last-child{border:0}
.line .art{width:84px;flex:none;border-radius:14px}
.line .art .em,.line .art .mono{font-size:38px}.line .art i,.line .art u{display:none}
.line-i{flex:1;min-width:0}
.line-i h4{font-size:14.5px;font-weight:600}
.line-i small{color:var(--muted)}
.line-p{text-align:right;min-width:100px}
.line-p b{font-weight:600}
.sum{position:sticky;top:96px}
.sum .r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--ink2)}
.sum .r.t{border-top:1px solid var(--line);margin-top:10px;padding-top:16px;font-size:16px;font-weight:600;color:var(--ink)}
.sum .r.t b{font:600 26px var(--serif)}
.sum .r.d span:last-child{color:var(--green)}
.addr{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.gh{font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.ship{display:grid;gap:8px;margin:12px 0 2px}
.ship label,.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:14px;transition:.2s}
.ship label:hover,.opt:hover{border-color:var(--ink)}
.ship label.on,.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ship label span,.opt span{flex:1;display:flex;flex-direction:column}
.ship small,.opt small{color:var(--muted);font-size:12px}
.ship label em{font-style:normal;font-weight:600}
.cp-in{display:flex;gap:8px;margin-top:10px}
.cp-in input,.f input,.f textarea{border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;background:#fff;outline:none;transition:.2s}
.cp-in input:focus,.f input:focus,.f textarea:focus{border-color:var(--ink)}
.f{display:grid;gap:12px;margin:14px 0}
.f label{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:90px 20px;color:var(--muted)}
.empty .big{font-size:52px;opacity:.7}
.tabs{display:flex;gap:26px;margin-bottom:18px;overflow-x:auto;border-bottom:1px solid var(--line);align-items:center}
.tabs button:not(.btn){padding:10px 0;color:var(--muted);font-size:15px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:not(.btn).on{color:var(--ink);border-color:var(--ink);font-weight:600}
.tabs .btn,.tabs select{margin-bottom:6px}
.oc{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
.oc-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:14px;gap:8px}
.st{font-weight:600;color:var(--teal-d)}
.st.done{color:var(--green)}.st.ref{color:var(--muted)}
.thumbs{display:flex;gap:8px;align-items:center}
.thumbs span{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:26px}
.oc-f{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
.tl{list-style:none;margin:8px 0 0 6px;border-left:1px solid var(--line)}
.tl li{position:relative;padding:0 0 22px 24px}
.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:#fff;border:1px solid #C5CAD3}
.tl li.cur::before{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 5px rgba(20,24,31,.1)}
.tl li.pass::before{background:var(--gold);border-color:var(--gold)}
.tl li b{display:block;font-size:14.5px}
.tl li small{color:var(--muted);display:block}
.tl li p{font-size:13.5px;color:var(--ink2)}
.route{position:relative;height:60px;margin:10px 8px 6px}
.route::before{content:"";position:absolute;left:0;right:0;top:32px;height:1px;background:var(--line)}
.route i{position:absolute;left:0;top:31px;height:3px;border-radius:2px;background:var(--ink);transition:width .6s}
.route span{position:absolute;top:8px;font-size:24px;transition:left .6s;transform:translateX(-50%)}
.route small{position:absolute;top:42px;font-size:12px;color:var(--muted)}
.wallet{background:var(--ink);color:#fff;border-radius:28px;padding:32px;display:grid;gap:20px;background-image:repeating-radial-gradient(circle at 100% 140%,transparent 0 46px,rgba(235,221,185,.12) 46px 47px)}
.wallet .big{font:600 clamp(34px,6vw,50px)/1.1 var(--serif);color:var(--gold-l);letter-spacing:-.01em}
.wallet .meta{display:flex;gap:32px;flex-wrap:wrap;font-size:13px;color:#AEB9C6}
.wallet .meta b{display:block;color:#fff;font-size:17px;font-weight:600}
.profile{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.profile .av{width:56px;height:56px;font-size:19px;background:var(--ink);font-family:var(--serif)}
.vip{font-size:11px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:0 10px;margin-left:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 28px}
.stats a{border:1px solid var(--line);border-radius:18px;text-align:center;padding:16px;transition:.2s}
.stats a:hover{border-color:var(--ink)}
.stats b{display:block;font:600 26px var(--serif)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{color:var(--muted);font-weight:500;text-align:right;padding:8px 6px;font-size:12px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:12px 6px;border-bottom:1px solid var(--line)}
.own{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.own .m{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
.own div:nth-child(2){flex:1}
.tx{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.tx small{display:block;color:var(--muted)}
/* —— 弹窗 / 收银台 —— */
#modal-root:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(15,20,28,.5);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.md{background:#fff;border-radius:24px;padding:28px;width:100%;max-width:440px;animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.md h3{font:600 20px var(--serif);margin-bottom:4px}
.md .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.payamt{font:600 40px var(--serif);margin:6px 0 2px;letter-spacing:-.01em}
.md .row{display:flex;gap:10px;margin-top:18px}.md .row .btn{flex:1}
.md .opts{margin-top:8px}
.err{color:var(--red);font-size:13px;margin-top:10px}
.pin{border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;background:#fff;text-align:center;font-size:26px;letter-spacing:12px;outline:none}
.pin:focus{border-color:var(--ink)}
.face{width:150px;height:150px;border-radius:50%;margin:20px auto;border:1px solid var(--ink);display:grid;place-items:center;font-size:70px;position:relative;overflow:hidden}
.face::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--teal);box-shadow:0 0 16px var(--teal);animation:scan 1.2s ease-in-out infinite alternate}
@keyframes scan{from{top:8%}to{top:92%}}
.plist{list-style:none;margin:18px 0 4px}
.plist li{padding:8px 0 8px 30px;position:relative;color:var(--muted);font-size:14px}
.plist li::before{content:"";position:absolute;left:4px;top:12px;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line)}
.plist li.run{color:var(--ink)}
.plist li.run::before{border-color:var(--ink);border-top-color:transparent;animation:spin .7s linear infinite}
.plist li.ok{color:var(--ink)}
.plist li.ok::before{background:var(--ink);border-color:var(--ink);content:"✓";color:#fff;font-size:9px;line-height:10px;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
.sp{display:inline-block;width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.okmark{width:68px;height:68px;border-radius:50%;border:1.5px solid var(--green);color:var(--green);display:grid;place-items:center;font-size:32px;margin:4px auto 14px;animation:pop .3s}
.okmark.bad{border-color:var(--red);color:var(--red)}
.starsel{display:flex;gap:4px;font-size:32px;color:#d6d9de;margin:8px 0}
.starsel button{font-size:32px;color:inherit;line-height:1}.starsel button.on{color:var(--gold)}
.sheet{position:relative;background:#fff;border-radius:28px;width:100%;max-width:980px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;animation:pop .22s ease-out}
.sheet .x{position:absolute;right:16px;top:14px;width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:15px;z-index:2}
.sheet .x:hover{background:var(--soft);color:var(--ink)}
.sheet-l{background:var(--soft);padding:44px 44px 36px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.sheet-r{padding:44px 44px 36px}
.sheet-r h3{font:600 19px var(--serif);margin-bottom:16px}
.mer{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:26px}
.mlogo{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--gold-l);display:grid;place-items:center;font:600 15px var(--serif)}
.lbl{color:var(--muted);font-size:13px}
.pl{margin:24px 0 8px;display:grid;gap:14px}
.pli{display:flex;gap:12px;align-items:center;font-size:14px}
.pli>div{flex:1;min-width:0}
.pli b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pli small{color:var(--muted);font-size:12px}
.pth{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
.sl{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:14px;color:var(--ink2)}
.sl div{display:flex;justify-content:space-between;padding:4px 0}
.sl .tot{font-weight:600;color:var(--ink);border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.legal{margin-top:auto;padding-top:24px;color:var(--muted);font-size:12px}
.pm{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;transition:.2s;overflow:hidden}
.pm.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pm-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left}
.rd{width:18px;height:18px;border-radius:50%;border:1.5px solid #C5CAD3;flex:none;position:relative}
.pm.on .rd{border-color:var(--ink)}
.pm.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.ic{width:22px;height:22px;fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pm-t{display:flex;flex-direction:column;line-height:1.35}
.pm-t small{color:var(--muted);font-size:12px}
.pm-b{padding:4px 16px 18px}
.fg{margin-top:12px}
.fg>label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.fg input,.fg select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px;background:#fff;outline:none;transition:.15s}
.fg input:focus,.fg select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,24,31,.07)}
.cardbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:.15s}
.cardbox:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,24,31,.07)}
.cardbox input,.cardbox select{border:0;border-radius:0;box-shadow:none!important}
.cardbox>div,.cardbox>select,.cardbox>input{border-top:1px solid var(--line)}
.cardbox>:first-child{border-top:0}
.crow{position:relative}
.bd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.cxrow{display:grid;grid-template-columns:1fr 1fr}
.cxrow input+input{border-left:1px solid var(--line)}
.bad{border-color:var(--red)!important}
.fe{color:var(--red);font-size:12.5px;margin-top:6px;min-height:0}
.fe:empty{display:none}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);margin-top:14px}
.ck input{accent-color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.hint a{color:var(--teal-d);text-decoration:underline;cursor:pointer}
.wb{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.wb b{font:600 20px var(--serif)}
.qrw{display:grid;justify-items:center;gap:10px;padding-top:6px}
.qrw svg{width:176px;height:176px;border:1px solid var(--line);border-radius:14px;padding:6px;background:#fff}
.qrw .qrt{font-size:13px;color:var(--muted)}
.qrw .qrt b{color:var(--ink);font-variant-numeric:tabular-nums}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.25}}
.kv{display:grid;gap:0;border-top:1px solid var(--line);font-size:13.5px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--muted);flex:none}
.kv b{font-weight:500;text-align:right;word-break:break-all}
.paybtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;margin-top:6px;transition:.2s}
.paybtn:hover{background:#000}
.paybtn:disabled{opacity:.4;cursor:not-allowed}
.paybtn .ic{stroke:#fff;width:17px;height:17px}
.sec-note{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
.bank-h{background:#1B3A5C;color:#fff;margin:-28px -28px 20px;padding:16px 28px;border-radius:24px 24px 0 0;display:flex;align-items:center;gap:10px;font-weight:600}
.bank-h .ic{stroke:#fff}
.kv2{border-top:1px solid var(--line);margin:14px 0;font-size:13.5px}
.kv2 div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv2 span{color:var(--muted)}
.linkbtn{color:var(--teal-d);font-size:13px;text-decoration:underline}
.linkbtn:disabled{color:var(--muted);text-decoration:none;cursor:default}
.dots{display:flex;gap:14px;justify-content:center;margin:20px 0 22px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #B6BCC6;transition:.12s}
.dots i.f{background:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.keys button{background:#fff;height:58px;font:500 22px var(--serif)}
.keys button:active{background:var(--soft)}
.keys .nb{background:var(--soft);cursor:default}
.rcpt{border-top:1px solid var(--line);margin-top:16px;font-size:13.5px}
.rcpt div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:12px}
.rcpt span{color:var(--muted)}
.rcpt b{font-weight:500;text-align:right}
#sms{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);width:min(92vw,380px);background:rgba(250,250,252,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:12px 16px;z-index:90;font-size:13.5px;transition:transform .45s cubic-bezier(.2,.9,.3,1);box-shadow:0 10px 30px rgba(10,20,40,.18)}
#sms.show{transform:translate(-50%,0)}
#sms small{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 22px;border-radius:999px;font-size:14px;z-index:95;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#tab{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:none;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
#tab a{flex:1;text-align:center;padding:8px 0 7px;font-size:11.5px;color:var(--muted);position:relative}
#tab a span{display:block;font-size:20px;line-height:1.2}
#tab a.on{color:var(--ink);font-weight:600}
#tab .badge{right:calc(50% - 24px);top:2px}
@media(max-width:900px){.pd{grid-template-columns:1fr;gap:28px}.pd .art{position:static}.two{grid-template-columns:1fr}.sum{position:static}.specs{grid-template-columns:1fr}.sheet{grid-template-columns:1fr;max-width:520px}.sheet-l{padding:28px 24px 20px;border-right:0;border-bottom:1px solid var(--line)}.sheet-r{padding:26px 24px 28px}.legal{display:none}.pl{display:none}}
@media(max-width:760px){#tab{display:flex}.nav-ic{display:none}.top-in{gap:12px;padding:12px 16px}.logo{font-size:18px;letter-spacing:.1em}.bal{padding:6px 12px}#app{padding:18px 16px 40px}.hero{padding:32px 26px;border-radius:22px}.tiles{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:26px 12px}.sec-h{margin-top:30px}.chips{gap:22px}#foot{margin-bottom:62px}.pd .art{border-radius:22px}.price b{font-size:32px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.myhold{display:flex;gap:26px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.myhold small{display:block;color:var(--muted);font-size:12px}
.myhold b{font-weight:600}
.psum{display:flex;gap:44px;flex-wrap:wrap;margin:6px 0 16px}
.psum small{display:block;color:var(--muted);font-size:12px}
.psum b{font:600 26px var(--serif)}
.newsbox{margin:0 0 14px;display:grid;gap:5px;font-size:13px;color:var(--ink2)}
.nw small{color:var(--muted);margin-left:8px;font-size:12px}
#tab{padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:4px}
#tab a{border-radius:16px;transition:background .2s,color .2s}
#tab a.on{background:var(--ink);color:#fff;font-weight:600}
#tab a.on .badge{background:#fff;color:var(--ink)}

.ov{display:flex;place-items:unset;align-items:flex-start;justify-content:center}
.ov>.sheet,.ov>.md{margin:auto}
#sms{opacity:0;pointer-events:none;transform:translate(-50%,-160%)}
#sms.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.sheet-l,.sheet-r{padding-top:40px;padding-bottom:32px}

.search{min-width:0}.search button{white-space:nowrap}
@media(max-width:760px){.search button{display:none}.search input{padding:10px 16px}.search{margin:0}}
/* ===== 导航（细线 SVG） ===== */
#tab{height:auto;padding:4px 6px calc(4px + env(safe-area-inset-bottom));gap:0;border-top:1px solid var(--line);background:rgba(255,255,255,.94)}
#tab a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 3px;font-size:10.5px;color:var(--muted);position:relative;background:none;border-radius:0;font-weight:400}
#tab a b{font-weight:500}
#tab .ti{display:grid;place-items:center;width:46px;height:28px;border-radius:14px;transition:background .25s,color .25s}
#tab .ti svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
#tab a.on{background:none;color:var(--ink);font-weight:400}
#tab a.on .ti{background:#E9ECF1}
#tab a.on b{font-weight:600}
#tab .badge{top:-1px;right:calc(50% - 25px);background:var(--ink);color:#fff}
#tab a.on .badge{background:var(--ink);color:#fff}
/* ===== 动画 ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fu{0%{background:rgba(30,158,106,.28)}100%{background:transparent}}
@keyframes fd{0%{background:rgba(216,52,79,.25)}100%{background:transparent}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bump{40%{transform:scale(1.5)}}
#app>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.fu{animation:fu .8s ease-out;border-radius:6px}.fd{animation:fd .8s ease-out;border-radius:6px}
.shake{animation:shake .4s}
.bump{animation:bump .4s}
.btn:active,.paybtn:active,.yl-btn:active{transform:scale(.97)}
.card .art .em,.card .art .mono{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card:hover .art .em,.card:hover .art .mono{transform:scale(1.08) rotate(-2deg)}
.aimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.panel,.oc,.tier,.bk{transition:border-color .25s,transform .25s}
.oc:hover,.bk:hover,.tier:hover{border-color:#C9CED6}
.bk:hover{transform:translateY(-3px)}
/* ===== 首页 ===== */
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;padding:18px 6px;border-bottom:1px solid var(--line)}
.feat div{display:flex;align-items:center;gap:10px;justify-content:center;font-size:14px;color:var(--ink2)}
.feat svg{width:22px;height:22px;fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.seller{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-radius:14px}
.seller>div{flex:1;min-width:0}
.seller b{display:block;font-size:14px;font-weight:600}
.seller small{color:var(--muted);font-size:12px}
.sl-av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--gold-l);display:grid;place-items:center;font:600 15px var(--serif);flex:none}
/* ===== 银行 ===== */
.cardrow{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.bcard{flex:0 0 310px;height:190px;border-radius:20px;padding:20px 22px;color:#fff;display:flex;flex-direction:column;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 12px 28px -14px rgba(20,24,31,.5);transition:transform .3s}
.bcard:hover{transform:translateY(-3px)}
.bcard::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 110% -20%,transparent 0 30px,rgba(255,255,255,.07) 30px 31px);pointer-events:none}
.bc-top{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.bc-top span{font-size:12px;opacity:.85;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:0 10px}
.chipx{width:38px;height:28px;border-radius:6px;margin-top:14px;background:linear-gradient(135deg,#e8d9a8,#b8975a)}
.bc-no{font:500 19px/1 "SF Mono",Menlo,Consolas,monospace;letter-spacing:.1em;margin-top:18px}
.bc-bot{display:flex;gap:18px;margin-top:auto;align-items:flex-end;font-size:13px}
.bc-bot small{display:block;font-size:10px;opacity:.75}
.bc-bot em{margin-left:auto;font:italic 700 15px Georgia,serif;font-style:italic}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bk{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;display:block}
.bk-h{display:flex;align-items:center;gap:12px;padding:16px 18px;color:#fff;position:relative}
.bk-h b{display:block;font-size:16px}.bk-h small{opacity:.85;font-size:12px}
.bk-h em{position:absolute;right:14px;top:14px;font-style:normal;font-size:11px;background:rgba(255,255,255,.22);border-radius:999px;padding:0 10px}
.bl{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.55);display:grid;place-items:center;font:600 18px var(--serif);flex:none}
.bl.big{width:56px;height:56px;font-size:26px}
.bk-b{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 18px;gap:8px}
.bk-b small{display:block;color:var(--muted);font-size:11.5px}.bk-b b{font:600 17px var(--serif)}
.bkhero{display:flex;gap:18px;align-items:center;color:#fff;border-radius:24px;padding:26px 28px;margin-bottom:18px}
.bkhero h2{font:600 22px var(--serif)}.bkhero p{opacity:.9;font-size:14px;max-width:560px;margin-top:4px}
.acct{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid var(--line);border-radius:20px;padding:22px 24px}
.ab{font:600 38px var(--serif);letter-spacing:-.01em}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.term{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.term:last-child{border:0}.term>div{flex:1;min-width:0}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--ink);transition:width .6s}
.promo{display:flex;justify-content:space-between;align-items:center;gap:16px;border:1px solid #F0D9A8;background:linear-gradient(135deg,#FFF8E6,#FFEFC9);border-radius:20px;padding:20px 24px}
.promo i{font-style:normal;font-size:12px;background:#E8A317;color:#fff;border-radius:999px;padding:1px 10px}
.promo b{display:block;font:600 18px var(--serif);margin:6px 0 2px}.promo p{font-size:13px;color:#8a6a20}
.promo .go{font-weight:600;color:#B5760A;white-space:nowrap}
/* ===== 会员 ===== */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.tier{border:1px solid var(--line);border-radius:24px;padding:28px 26px;display:flex;flex-direction:column;gap:12px;background:#fff}
.tier.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tn{font:600 20px var(--serif);letter-spacing:.06em}
.tp b{font:600 36px var(--serif)}.tp span{color:var(--muted);margin-left:4px}
.tier ul{list-style:none;display:grid;gap:9px;margin:6px 0 14px;flex:1;font-size:14px;color:var(--ink2)}
.tier li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:10px;vertical-align:middle}
/* ===== 设置 ===== */
.hues{display:flex;gap:10px;margin-top:6px}.hue{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.hue.on{box-shadow:0 0 0 2px var(--ink)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow small{display:block;color:var(--muted);font-size:12.5px}
.vip{text-decoration:none}
/* ===== 消息 / 诈骗 / 反诈 ===== */
.msg{border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;background:#fff}
.mh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}.mh b{color:var(--ink)}
.msg p{font-size:14.5px;color:var(--ink2);word-break:break-all}
.mlink{display:inline-block;margin-top:8px;color:#2a6bd8;text-decoration:underline;cursor:pointer;font-size:14px;word-break:break-all}
.mf{display:flex;gap:16px;margin-top:10px;justify-content:flex-end}
.ext{max-width:560px;margin:0 auto;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.ebar{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line);font-size:13px}
.ebar .lk{color:var(--green)}.ebar .lk.bad{color:var(--red);font-size:12px;border:1px solid var(--red);border-radius:6px;padding:0 6px}
.ebar .url{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph{padding:0 0 22px}.ph>*:not(.ph-h){margin-left:22px;margin-right:22px}
.ph-h{background:linear-gradient(135deg,#d93a2b,#f0803a);color:#fff;padding:22px;margin-bottom:16px}
.ph-h b{display:block;font:600 19px var(--serif)}.ph-h small{opacity:.9}
.ph p{margin-bottom:12px;color:var(--ink2);font-size:14px}
.inv{text-align:center;padding:10px 0}.inv .ab{font-size:34px}
.inv-warn{background:#FFF1F0;border:1px solid #FFCCC7;color:#B42318;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.lesson h4{margin:14px 0 6px;font-size:14px}.lesson ul{padding-left:20px;display:grid;gap:5px;font-size:14px;color:var(--ink2)}.lesson ul.ok li::marker{color:var(--green)}
.lesson.locked{opacity:.6;text-align:center}
.adm{text-align:center}.adm i{font-style:normal;font-size:12px;background:#E8A317;color:#fff;border-radius:999px;padding:2px 12px}
.adm h3{font:600 20px/1.4 var(--serif);margin:14px 0 6px}.adm p{color:var(--muted);font-size:14px}
/* 易融金服页 */
.yl{padding:0 0 20px;background:#F2F6FC}
.yl-h{background:#1F6FEB;color:#fff;padding:14px 20px}.yl-h b{font-size:18px}.yl-h small{display:block;opacity:.85;font-size:11px}
.yl-hero{background:linear-gradient(135deg,#1F6FEB,#4C94FF);color:#fff;padding:20px;text-align:center}
.yl-hero .big{font:700 42px var(--serif);margin:4px 0}.yl-hero p{font-size:13.5px;opacity:.95}
.yl-box{background:#fff;margin:14px 16px 0;border:1px solid #dfe6f0;border-radius:14px;padding:16px}
.yl-line{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.yl-more{color:#1F6FEB;font-size:13px;margin:4px 0}
.yl-fine{background:#F7F9FC;border-radius:10px;padding:8px 12px;margin:6px 0}
.yl-fine div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:11px;color:#9AA4B2}
.yl-fine b{font-weight:500;text-align:right}
.yl-ck{display:block;font-size:11px;color:#9AA4B2;margin:10px 0}.yl-ck a{color:#1F6FEB}
.yl-btn{width:100%;height:50px;border-radius:25px;background:linear-gradient(90deg,#1F6FEB,#4C94FF);color:#fff;font-weight:700;font-size:16px}

/* ===================== v3：动画 / 防闪动 / 布局 ===================== */
:root{--tabh:0px;--ease:cubic-bezier(.2,.7,.2,1);--boom:#1E9E6A;--crash:#D8344F;--slump:#6B7A99;--recov:#0E7C7B}
::selection{background:var(--gold-l);color:var(--ink)}
/* 防闪动：局部刷新时不再让所有子元素重播入场动画，仅在切换页面时淡入 */

#app.enter{animation:pgin .4s ease-out both}

@keyframes pgin{from{opacity:0}to{opacity:1}}
/* 报价跳动：只让数字短暂变色，不再整块闪底色 */
@keyframes fu{0%{color:var(--green)}100%{color:inherit}}
@keyframes fd{0%{color:var(--red)}100%{color:inherit}}
.fu{animation:fu 1.4s ease-out;border-radius:0}.fd{animation:fd 1.4s ease-out;border-radius:0}

/* ============ 轻量 DOM 对比更新：只改动变化的节点，避免整页重绘闪动 ============ */
function syncAttrs(f,t){
 if(f.tagName==='IMG'){if(f.getAttribute('src')!==t.getAttribute('src')){[...f.attributes].forEach(a=>f.removeAttribute(a.name));[...t.attributes].forEach(a=>f.setAttribute(a.name,a.value))}return}
 [...f.attributes].forEach(a=>{if(!t.hasAttribute(a.name))f.removeAttribute(a.name)});
 [...t.attributes].forEach(a=>{if(f.getAttribute(a.name)!==a.value)f.setAttribute(a.name,a.value)})}
function morph(from,to){
 const fc=from.childNodes,tc=to.childNodes;
 for(let i=0;i<tc.length;i++){
  const t=tc[i],f=fc[i];
  if(!f){from.appendChild(t.cloneNode(true));continue}
  if(f.nodeType!==t.nodeType||(t.nodeType===1&&f.tagName!==t.tagName)){from.replaceChild(t.cloneNode(true),f);continue}
  if(t.nodeType!==1){if(f.nodeValue!==t.nodeValue)f.nodeValue=t.nodeValue;continue}
  syncAttrs(f,t);
  if(f.tagName==='IMG')continue;
  if(f.firstChild&&(f.hasAttribute('data-live')||f.hasAttribute('data-news')||f.hasAttribute('data-spark')||f.hasAttribute('data-hold')))continue;
  morph(f,t);
  const tg=f.tagName;
  if(tg==='INPUT'){if(f.type==='checkbox'||f.type==='radio')f.checked=t.checked;else if(f!==document.activeElement&&f.value!==t.value)f.value=t.value}
  else if(tg==='TEXTAREA'||tg==='SELECT'){if(f!==document.activeElement&&f.value!==t.value)f.value=t.value}
 }
 while(fc.length>tc.length)from.removeChild(from.lastChild)}
function morphInto(el,html){const t=document.createElement('template');t.innerHTML=html;morph(el,t.content)}
function setHTML(el,html){morphInto(el,html)}

 let disc=0;const c=S.coupon;if(c&&elig>=c.min)disc=Math.min(elig,r2(c.type==='flat'?c.v:elig*c.v));

function advance(o,forced){
 if(o.status!=='active'||o.idx>=o.stages.length-1)return;

 if(o.idx===o.stages.length-1)finish(o)}
function finish(o){
 o.status='delivered';o.doneAt=Date.now();
 o.items.forEach(i=>{const p=PM[i.pid];
  if(i.group==='shares'){const h=S.hold.find(x=>x.pid===i.pid);if(h){h.qty+=i.qty;h.cost=r2(h.cost+i.unit*i.qty)}else S.hold.push({pid:i.pid,qty:i.qty,cost:r2(i.unit*i.qty)})}
  else if(i.group==='acquire')S.owned.push({pid:i.pid,cost:i.unit,date:new Date(),oid:o.id});
  else S.things.push({pid:i.pid,name:i.name,qty:i.qty,cost:i.unit*i.qty,oid:o.id})});
 toast(o.group==='acquire'?'🎉 恭喜！'+PM[o.items[0].pid].name.split(' ')[0]+' 已归您所有':'✅ 订单 '+o.id+' 已完成');updateChrome()}

 const amt=full?o.total:r2(o.total-o.shipFee-o.ins);
 if(o.status==='delivered'){o.items.forEach(i=>{if(i.group==='physical'){const k=S.things.findIndex(t=>t.oid===o.id&&t.pid===i.pid);if(k>-1)S.things.splice(k,1)}})}

function pageBankDetail(id){const b=BK[id],a=S.banks[id];
 const rates=`<div class="panel"><h2>存款利率（年化）</h2><table class="tbl"><tr><th>期限</th><th>活期</th>${TERMS.map(t=>`<th>${t[1]}</th>`).join('')}</tr><tr><td>利率</td>${b.dep.map(r=>`<td>${(r*100).toFixed(2)}%</td>`).join('')}</tr></table><p class="muted" style="margin-top:10px">消费贷年化 ${(b.loan*100).toFixed(2)}% · 最高额度 ${fmt(b.cap)} · 审批约 ${b.days} 个银行日${b.fee?` · 账户余额低于 ${fmt(b.min)} 时每月收费 ${fmt(b.fee)}`:' · 无账户管理费'}</p></div>`;
 const head=`<div class="crumb"><a href="#/bank">银行</a> / ${b.s}</div><div class="bkhero" style="background:linear-gradient(135deg,${b.c[0]},${b.c[1]})"><span class="bl big">${b.s[0]}</span><div><h2>${b.n}</h2><p>${b.tag} · ${b.about}</p></div></div>`;
 if(!a)return head+`<div class="panel" style="text-align:center"><p style="margin-bottom:14px">您还没有 ${b.s} 账户。开户后将自动开通一张借记卡。</p><button class="btn pri" data-act="openAcct" data-id="${id}">立即开户</button></div>${rates}`;
 const cards=S.cards.filter(c=>c.bank===id),loans=S.loans.filter(l=>l.bank===id);
 return head+`<div class="acct"><div><small>账户余额（USD）</small><div class="ab">${fmt(a.bal)}</div><small class="muted">累计利息 ${fmt(a.int)} · 活期年化 ${(b.dep[0]*100).toFixed(2)}%</small></div>
 <div class="acts"><button class="btn pri sm" data-act="dep" data-id="${id}">存入</button><button class="btn ghost sm" data-act="wd" data-id="${id}">取出</button><button class="btn ghost sm" data-act="termOpen" data-id="${id}">定期存款</button><button class="btn ghost sm" data-act="cardOpen" data-id="${id}">办理银行卡</button><button class="btn ghost sm" data-act="loanOpen" data-id="${id}">申请贷款</button></div></div>
 ${a.terms.length?`<div class="panel"><h2>定期存款</h2>${a.terms.map(t=>{const left=Math.max(0,t.mature-S.bankDay),pc=clamp((S.bankDay-t.start)/t.days*100,0,100);return `<div class="term"><div><b>${fmt(t.p)}</b> · ${t.name} · 年化 ${(t.rate*100).toFixed(2)}%<small class="muted" style="display:block">到期 ${dfmt(t.mature)}（还剩 ${Math.ceil(left)} 个银行日）· 到期收益 ${fmt(t.p*t.rate*t.days/365)}</small><div class="prog"><i style="width:${pc}%"></i></div></div><button class="btn ghost sm" data-act="termBreak" data-id="${id}" data-t="${t.id}">提前支取</button></div>`}).join('')}</div>`:''}

 ${loans.length?`<div class="panel"><h2>我的贷款</h2>${loans.slice().reverse().map(l=>loanRow(l)).join('')}</div>`:''}
 ${rates}
 <div class="panel"><h2>账户明细</h2>${a.log.length?a.log.map(x=>`<div class="tx"><div>${esc(x.title)}<small>${tstr(new Date(x.t))}</small></div><b class="${x.amt>=0?'up':''}">${x.amt>=0?'+':'−'}${fmt(Math.abs(x.amt))}</b></div>`).join(''):'<div class="muted">暂无明细</div>'}</div>`}
function loanRow(l){if(l.kind==='cc'||!l.status)return '';const b=BK[l.bank];
 if(l.status==='review'){const el=S.bankDay-l.applyDay,pc=clamp(el/l.days*100,0,100),stg=['提交申请','资料审核','征信查询','风控审批','签约放款'],cut=[.05,.3,.55,.85,1],ix=cut.findIndex(c=>pc/100<c);
  return `<div class="term"><div><b>${fmt(l.P)} · ${l.n} 个月 · 年化 ${(l.rate*100).toFixed(2)}%</b><small class="muted" style="display:block">审批中：${stg[ix<0?4:ix]}（预计 ${Math.max(1,Math.ceil(l.days-el))} 个银行日后出结果）</small><div class="prog"><i style="width:${pc}%"></i></div></div></div>`}
 if(l.status==='rejected')return `<div class="term"><div><b>${fmt(l.P)} 贷款申请未通过</b><small class="muted" style="display:block">综合评分不足，信用分已记录一次查询。</small></div></div>`;
 if(l.status==='closed')return `<div class="term"><div><b>${fmt(l.P)} 贷款已结清</b><small class="muted" style="display:block">共还款 ${l.paid} 期，感谢您的守信。</small></div></div>`;
 if(l.status!=='active')return '';
 return `<div class="term"><div><b>${fmt(l.P)} · ${l.n} 个月 · 年化 ${(l.rate*100).toFixed(2)}%</b><small class="muted" style="display:block">剩余本金 ${fmt(l.remain)} · 月供 ${fmt(l.pmt)} · 已还 ${l.paid}/${l.n} 期 · 下次扣款 ${dfmt(l.nextDue)}${l.overdue?` · <span class="dn">已逾期，待补缴 ${fmt(l.pmt+l.late)}</span>`:''}</small><div class="prog"><i style="width:${l.paid/l.n*100}%"></i></div></div><button class="btn ghost sm" data-act="loanRepay" data-id="${l.id}">提前还款</button></div>`}

function moveModal(id,dir){const a=S.banks[id],b=BK[id],max=dir==='in'?S.balance:a.bal;
 openModal(`<h3>${dir==='in'?'存入':'取出'} · ${b.s}</h3><p class="sub">${dir==='in'?'从钱包余额转入银行账户':'从银行账户转出到钱包余额'}，可用 ${fmt(max)}</p><div class="f"><div><label>金额（USD）</label><input id="mv" type="number" min="1" max="${max}" placeholder="0.00"></div></div><div class="opts" style="margin-bottom:6px">${[.1,.25,.5,1].map(x=>`<button data-act="mvPct" data-v="${x}" data-m="${max}">${x*100}%</button>`).join('')}</div><div class="row"><button class="btn ghost" data-act="closeModal">取消</button><button class="btn pri" data-act="mvGo" data-id="${id}" data-d="${dir}">确认</button></div>`)}
function moveGo(id,dir){const v=r2(+$('#mv').value),a=S.banks[id];if(!(v>0)){toast('请输入有效金额');return}
 const run=()=>{if(dir==='in'){if(v>S.balance){toast('钱包余额不足');return}S.balance=r2(S.balance-v);a.bal=r2(a.bal+v);blog(a,'转入（钱包）',v);S.tx.push({t:new Date(),title:'转入 '+BK[id].s+' 账户',amt:-v})}
  else{if(v>a.bal){toast('账户余额不足');return}a.bal=r2(a.bal-v);S.balance=r2(S.balance+v);blog(a,'转出（钱包）',-v);S.tx.push({t:new Date(),title:'从 '+BK[id].s+' 账户转出',amt:v})}
  closeModal();updateChrome();route(true);toast('操作成功')};
 if(dir==='out'||v>=5000)needPin(run,{title:'验证支付密码',sub:(dir==='in'?'转入 ':'转出 ')+fmt(v)});else run()}
let TM={};
function termModal(id){const a=S.banks[id],b=BK[id];TM={id,i:2};drawTerm()}
function drawTerm(){const a=S.banks[TM.id],b=BK[TM.id],[d,n]=TERMS[TM.i],r=b.dep[TM.i+1];
 openModal(`<h3>定期存款 · ${b.s}</h3><p class="sub">从账户余额划转，到期自动本息转入活期。可用 ${fmt(a.bal)}</p><div class="opts">${TERMS.map((t,i)=>`<button class="${TM.i===i?'on':''}" data-act="termPick" data-i="${i}">${t[1]}</button>`).join('')}</div><div class="rcpt"><div><span>年化利率</span><b>${(r*100).toFixed(2)}%</b></div><div><span>到期日</span><b>${dfmt(S.bankDay+d)}</b></div></div><div class="f"><div><label>存入金额（USD，起存 $100）</label><input id="tmv" type="number" min="100" max="${a.bal}" placeholder="0.00"></div></div><p class="muted" id="tmh">提前支取仅按活期利率计息。</p><div class="row"><button class="btn ghost" data-act="closeModal">取消</button><button class="btn pri" data-act="termGo">确认存入</button></div>`)}
function termGo(){const a=S.banks[TM.id],b=BK[TM.id],v=r2(+$('#tmv').value),[d,n]=TERMS[TM.i];if(!(v>=100)||v>a.bal){toast(v>a.bal?'账户余额不足':'起存金额 $100');return}

function termBreak(id,tid){const a=S.banks[id],t=a.terms.find(x=>x.id===tid);if(!t)return;
 const el=S.bankDay-t.start,int=t.p*BK[id].dep[0]*el/365;openModal(`<h3>提前支取</h3><p class="sub">提前支取仅按活期利率计息，已损失定期收益。</p><div class="rcpt" style="margin-top:0"><div><span>本金</span><b>${fmt(t.p)}</b></div><div><span>活期利息</span><b>${fmt(int)}</b></div><div><span>原定到期收益</span><b>${fmt(t.p*t.rate*t.days/365)}</b></div></div><div class="row"><button class="btn ghost" data-act="closeModal">再想想</button><button class="btn pri" data-act="termBreakGo" data-id="${id}" data-t="${tid}">确认支取</button></div>`)}
function termBreakGo(id,tid){const a=S.banks[id],t=a.terms.find(x=>x.id===tid);if(!t)return;needPin(()=>{const int=t.p*BK[id].dep[0]*(S.bankDay-t.start)/365;a.bal=r2(a.bal+t.p+int);a.int=r2(a.int+int);a.terms=a.terms.filter(x=>x!==t);blog(a,'定期提前支取',t.p+int);closeModal();route(true);toast('已转入活期账户')},{title:'验证支付密码',sub:'提前支取定期存款'})}
function cardModal(id){const b=BK[id];openModal(`<h3>办理银行卡 · ${b.s}</h3><p class="sub">借记卡立即开通；信用卡需审核，额度取决于个人信用分（当前 ${S.credit}）。</p><div class="ship"><label class="on"><span><b>借记卡</b><small>绑定储蓄账户，即时发卡</small></span><em>免费</em></label><label><span><b>信用卡</b><small>预计额度 ${fmt(ccLimit())} · 审批约 6 个银行日 · 免息期 25 日</small></span><em>免费</em></label></div><div class="row"><button class="btn ghost" data-act="cardGo" data-id="${id}" data-t="debit">办借记卡</button><button class="btn pri" data-act="cardGo" data-id="${id}" data-t="credit">申请信用卡</button></div>`)}
function cardGo(id,type){const b=BK[id];
 if(type==='debit'){const c=issueCard(id,'debit');closeModal();route(true);toast('借记卡已开通：尾号 '+c.no.slice(-4));return}

let LN={};
function loanModal(id){const a=S.banks[id],b=BK[id],lim=loanLimit(b);
 if(S.loans.some(l=>l.bank===id&&l.kind==='bank'&&(l.status==='review'||l.status==='active'))){toast('您在该行已有进行中的贷款');return}

  closeModal();route(true);toast('贷款申请已提交，银行正在审核')},{title:'验证支付密码',sub:'提交 '+fmt(amt)+' 贷款申请'})}
function loanRepayModal(lid){const l=S.loans.find(x=>x.id===lid),a=S.banks[l.bank];const need=r2(l.remain+(l.late||0));
 openModal(`<h3>提前还款</h3><p class="sub">一次性还清剩余本金，不收违约金。从 ${BK[l.bank].s}账户扣款。</p><div class="rcpt" style="margin-top:0"><div><span>应还金额</span><b>${fmt(need)}</b></div><div><span>账户余额</span><b>${fmt(a.bal)}</b></div></div>${a.bal<need?'<div class="err">账户余额不足，请先存入</div>':''}<div class="row"><button class="btn ghost" data-act="closeModal">取消</button><button class="btn pri" data-act="loanRepayGo" data-id="${lid}" ${a.bal<need?'disabled':''}>确认还款</button></div>`)}
